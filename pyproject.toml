[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gguf-arena"
version = "0.1.0"
description = "Desktop GUI for benchmarking local GGUF models via llama.cpp"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.0",
    "pyyaml>=6.0",
    "huggingface_hub>=0.20.0",
]

[project.scripts]
llm-stand = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages   = ["src"]
