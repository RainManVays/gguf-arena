services:
  dev:
    # CPU default — works everywhere:
    image: python:3.12-bookworm
    #
    # GPU (NVIDIA) — uncomment and comment the line above:
    # image: nvidia/cuda:12.4.1-devel-ubuntu22.04
    volumes:
      - ..:/workspace:cached
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
      - llm-stand-data:/root/.llm_stand
      - ${MODELS_DIR:-/tmp/models}:/models:ro
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
      - DEVCONTAINER=1
    command: sleep infinity
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # GPU resources — uncomment when using the NVIDIA image:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  llm-stand-data:
